# What llmbench pulls from. This is the only file you need to edit to add, change or
# remove a source. Every field is described in docs/llm-benchmark-aggregator-plan.md, section 3.
#
# terms: allowed  -> fetched
# terms: blocked  -> listed for the record, never fetched. Only for sources whose terms forbid reuse
#                    or automated access; a missing or non-commercial licence is not a reason.
# license: the data's licence as the source states it, or "none stated". Non-commercial (NC) and
#          unstated licences are shown as such on the site and in every download.
#
# Quick reference for a source without a plugin:
#   fetch       github:owner/repo/path (globs allowed) | hf:owner/dataset | https://...
#               CSV, TSV, JSON, JSON Lines, YAML, Parquet or a Markdown table (README.md)
#   table       for Markdown: which table, by position (0 = first) or heading text
#   model       column with the model name                 (required)
#   scores      score columns; omit to take every numeric column
#   metric/value  for long tables: column(s) naming the metric, column holding the number
#   key         column(s) that make a row unique when the model name does not
#   context     columns describing how the model was run
#   date, model_url, model_label, ci, ignore, filter, labels, unit, units, lower_is_better
#   headline    metrics shown in the default "most covered" column choice (default: all)
#   tags        explorer presets: a list for every metric, or metric (or glob) -> list.
#               Known: coding, agents, math, knowledge, chat, vision, search
#   min_rows    a run with fewer rows is held       rolling: true for ratings that drift
#   duplicates  hold (default) | drop: what to do when the source repeats a row ambiguously
#   round       decimals to keep for numeric scores, only where extra precision is noise
#   every       how often to check (30m, 6h, 1d)
#
# To draft an entry for a new file: npm run add-source -- <location>
# To try an entry without writing anything: npm run scrape -- --source <id> --dry-run

defaults:
  every: 6h
  run_by: independent

sources:
  # Open compilation of published results, each with its own source URL and licence.
  # Seeds the model catalogue. Rows are long-form: one result per row.
  - id: whatmodel
    name: whatmodel.sh
    homepage: https://whatmodel.sh
    fetch: github:jakemanger/whatmodel/data
    plugin: whatmodel
    every: 1d
    categories: [llm]
    tags:                        # added to whatmodel's own task tags
      gpqa-diamond: [knowledge]
      "hle*": [knowledge]
      "mmlu*": [knowledge]
      "simpleqa*": [knowledge]
      bbh: [knowledge]
      musr: [knowledge]
      "arcprize-*": [knowledge]
    min_rows: 10000
    license: CC BY-SA 4.0
    attribution: >-
      whatmodel.sh by Merlinsbeard Pty Ltd, CC BY-SA 4.0. The underlying sources keep their own
      licences; see data/sources/whatmodel/upstream-sources.jsonl.
    terms: allowed

  # Epoch's own evaluation runs, one CSV per benchmark, plus the Epoch Capabilities Index.
  - id: epoch
    name: Epoch AI Benchmarking Hub
    homepage: https://epoch.ai/benchmarks
    fetch: https://epoch.ai/data/benchmark_data.zip
    plugin: epoch
    include_external: false     # Epoch's copies of other leaderboards; their terms are not reviewed
    tags:
      gpqa_diamond: [knowledge]
      simpleqa_verified: [knowledge]
      chess_puzzles: [knowledge]
      mystery_game_puzzles: [knowledge]
      "frontiermath*": [math]
      math_level_5: [math]
      otis_mock_aime_2024_2025: [math]
      swe_bench_verified: [coding, agents]
      mirrorcode: [coding]
      furniture_assembly: [agents]
      "spireclimb*": [agents]
    every: 1d
    min_rows: 500
    license: CC BY 4.0
    attribution: Epoch AI, 'Capabilities & benchmarking', https://epoch.ai/benchmarks, CC BY 4.0
    terms: allowed

  # Arena's open dataset, one Parquet file per arena. Each category becomes a metric,
  # e.g. "text/overall" or "webdev/overall".
  - id: arena
    name: Arena
    homepage: https://arena.ai/leaderboard
    fetch: hf:lmarena-ai/leaderboard-dataset
    configs: [text, text_style_control, webdev, vision, search, document]
    split: latest
    model: model_name
    key: [model_name, _config]
    metric: [_config, category]
    value: rating
    ci: [rating_lower, rating_upper]
    date: leaderboard_publish_date
    unit: elo
    rolling: true
    # Ratings are fitted values with ~13 meaningless decimals that move on every update;
    # one decimal keeps the repository from growing by hundreds of MB a year. Rank and variance
    # also move on every update and are derivable (rank) or covered by the interval (variance).
    round: 1
    ignore: [rank, variance]
    # Arena sometimes lists two different entries under one name with nothing to tell them
    # apart; leave those out rather than guess.
    duplicates: drop
    every: 7d
    min_rows: 300
    headline: [text/overall, text_style_control/overall, webdev/overall, vision/overall, search/overall, document/overall]
    labels:
      text/overall: Arena text
      text_style_control/overall: Arena text (style control)
      webdev/overall: Arena WebDev
      vision/overall: Arena vision
      search/overall: Arena search
      document/overall: Arena document
    tags:
      "text/*": [chat]
      "text_style_control/*": [chat]
      "*/coding": [coding]
      "*/math": [math]
      "webdev/*": [coding]
      "vision/*": [vision]
      "document/*": [vision]
      "search/*": [search]
    license: CC BY 4.0
    attribution: Arena Leaderboard Dataset by LMArena (lmarena-ai), CC BY 4.0
    terms: allowed
    terms_note: Fetched from the open dataset only. The arena.ai website's terms forbid scraping.

  - id: bfcl
    name: Berkeley Function Calling Leaderboard
    homepage: https://gorilla.cs.berkeley.edu/leaderboard.html
    fetch: https://gorilla.cs.berkeley.edu/data_overall.csv
    model: Model
    model_url: Model Link
    ignore: [Rank]
    lower_is_better:
      - Total Cost ($)
      - Latency Mean (s)
      - Latency Standard Deviation (s)
      - Latency 95th Percentile (s)
      - Format Sensitivity Max Delta
      - Format Sensitivity Standard Deviation
    headline: [Overall Acc, Live Acc, Multi Turn Acc, Web Search Acc, Memory Acc]
    tags: [agents]
    min_rows: 50
    license: Apache-2.0 (BFCL repository, ShishirPatil/gorilla)
    terms: allowed

  - id: aider-polyglot
    name: Aider polyglot
    homepage: https://aider.chat/docs/leaderboards/
    fetch: github:Aider-AI/aider/aider/website/_data/polyglot_leaderboard.yml
    model: model
    key: dirname                 # the leaderboard lists several runs per model
    context: [edit_format]
    date: date
    scores: [pass_rate_2, pass_rate_1, percent_cases_well_formed]
    labels:
      pass_rate_2: Polyglot pass rate (2 tries)
      pass_rate_1: Polyglot pass rate (1 try)
      percent_cases_well_formed: Polyglot well-formed edits
    unit: percent
    headline: [pass_rate_2]
    tags: [coding]
    every: 1d
    min_rows: 50
    license: Apache-2.0
    terms: allowed

  # Customer-service agents with a simulated user, in four domains. One submission.json per
  # leaderboard entry; the plugin reads the manifest of the current text leaderboard.
  - id: tau2-bench
    name: τ²-bench
    homepage: https://www.taubench.com
    fetch: github:sierra-research/tau2-bench/web/leaderboard/public/submissions
    plugin: tau2
    every: 1d
    min_rows: 10
    license: MIT
    attribution: τ²-bench leaderboard by Sierra Research (github.com/sierra-research/tau2-bench), MIT
    terms: allowed

  # Hallucination rate when summarising documents, judged by Vectara's HHEM model. The leaderboard
  # is a Markdown table in the repository's README, updated every few weeks.
  - id: vectara-hhem
    name: Vectara Hallucination Leaderboard
    homepage: https://github.com/vectara/hallucination-leaderboard
    fetch: github:vectara/hallucination-leaderboard/README.md
    table: 0                    # the first table in the README
    model: Model
    scores: [Hallucination Rate, Factual Consistency Rate, Answer Rate]
    lower_is_better: [Hallucination Rate]
    headline: [Hallucination Rate]
    every: 1d
    min_rows: 50
    license: Apache-2.0
    attribution: Vectara Hallucination Leaderboard (github.com/vectara/hallucination-leaderboard), Apache-2.0
    terms: allowed

  - id: artificial-analysis
    name: Artificial Analysis
    homepage: https://artificialanalysis.ai
    terms: blocked
    terms_note: >-
      Per whatmodel's licence ledger, the site terms allow personal non-commercial use only
      and forbid building a similar or competing service.

  - id: arc-prize
    name: ARC Prize
    homepage: https://arcprize.org/leaderboard
    terms: blocked
    terms_note: >-
      The site's terms (arcprize.org/terms, checked 2026-11-13) forbid accessing it "through
      automated or non-human means, whether through a bot, script or otherwise". The data
      (media/data/evaluations.json) would otherwise be easy to read.

  - id: scale-seal
    name: Scale SEAL leaderboards (including Humanity's Last Exam)
    homepage: https://labs.scale.com/leaderboard
    terms: blocked
    terms_note: >-
      Scale's terms (scale.com/legal/terms, checked 2026-11-13) forbid accessing the sites "in
      order to build a competitive product or service". Whether an aggregator counts is a
      judgement call; left out until decided.

  # SWE-bench: agents fixing real GitHub issues, five boards in one file. A plugin keeps runs where
  # the SWE-bench team put every model in the same minimal agent ("bash only") apart from systems
  # submitted by their builders, so a model's score never silently becomes the best of any scaffold.
  - id: swe-bench
    name: SWE-bench
    homepage: https://www.swebench.com
    plugin: swebench
    fetch: github:SWE-bench/swe-bench.github.io/data/leaderboards.json
    every: 1d
    min_rows: 200
    license: CC BY-NC 4.0
    attribution: SWE-bench leaderboards (github.com/SWE-bench/swe-bench.github.io), CC BY-NC 4.0
    terms: allowed

  # Terminal-Bench: agents doing hard tasks in a terminal, served by an open JSON endpoint. Each
  # entry is an agent and a model; the agent is kept as context. Versions are listed here, newest
  # first (the site only lists them in its own script): add a line when a new version appears.
  - id: terminal-bench
    name: Terminal-Bench
    homepage: https://www.tbench.ai/leaderboard
    plugin: terminalbench
    fetch: https://ofhuhcpkvzjlejydnvyd.supabase.co/functions/v1/leaderboard-read
    boards:
      - { package: terminal-bench/terminal-bench, name: 4-1-0, version: "4.1" }
      - { package: terminal-bench/terminal-bench-2-1, name: main, version: "2.1" }
      - { package: terminal-bench/terminal-bench-2, name: 2-0, version: "2.0" }
    every: 1d
    min_rows: 150
    run_by: submitted
    license: Apache-2.0
    attribution: Terminal-Bench (tbench.ai, github.com/harbor-framework/terminal-bench), Apache-2.0
    terms: allowed

  # LiveBench: questions are replaced at every release, so each release gets its own columns. Read
  # from the site's own files (the GitHub copy stopped updating in mid-2026): LiveBench 1.0 releases
  # (2024-06 to 2026-06) and LiveBench 2.0 (from 2026-10). Category averages, Overall and cost per
  # task are computed the way the site computes them; see scripts/sources/livebench.ts.
  - id: livebench
    name: LiveBench
    homepage: https://livebench.ai
    plugin: livebench
    fetch: https://livebench.ai/
    every: 1d
    min_rows: 400
    license: none stated
    attribution: LiveBench (livebench.ai)
    terms: allowed

  # Lech Mazur's benchmarks. Each repository's README starts with a Markdown table of models; none
  # states a licence. Names carry the reasoning setting in brackets: "GPT-5 (medium reasoning)".
  - id: nyt-connections
    name: NYT Connections (extended)
    homepage: https://github.com/lechmazur/nyt-connections
    fetch: github:lechmazur/nyt-connections/README.md
    table: 0
    model: Model
    scores: [Score %]
    labels: { Score %: NYT Connections score }
    unit: percent
    ignore: [Rank]
    every: 1d
    min_rows: 100
    license: none stated
    attribution: Extended NYT Connections benchmark by Lech Mazur (github.com/lechmazur/nyt-connections)
    terms: allowed

  - id: lechmazur-writing
    name: Short-story writing (Lech Mazur)
    homepage: https://github.com/lechmazur/writing
    fetch: github:lechmazur/writing/README.md
    table: 0
    model: Model
    scores: [Comparison score, Estimated win chance]
    headline: [Comparison score]
    units: { Estimated win chance: percent }
    ignore: [Rank]
    every: 1d
    min_rows: 40
    license: none stated
    attribution: Creative short-story writing benchmark by Lech Mazur (github.com/lechmazur/writing)
    terms: allowed

  - id: lechmazur-debate
    name: Debate (Lech Mazur)
    homepage: https://github.com/lechmazur/debate
    fetch: github:lechmazur/debate/README.md
    table: 0
    model: Model
    scores: [BT]
    labels: { BT: Bradley-Terry rating }
    unit: elo
    ignore: [Rank]
    every: 1d
    min_rows: 40
    license: none stated
    attribution: LLM debate benchmark by Lech Mazur (github.com/lechmazur/debate)
    terms: allowed

  - id: elimination-game
    name: Elimination Game (Lech Mazur)
    homepage: https://github.com/lechmazur/elimination_game
    fetch: github:lechmazur/elimination_game/README.md
    table: 0
    model: Model
    scores: [μ, Avg Points]
    headline: [μ]
    labels: { μ: TrueSkill μ, Avg Points: Average points }
    ignore: [Rank]
    duplicates: drop            # the README lists one model name twice
    every: 7d
    min_rows: 40
    license: none stated
    attribution: Elimination Game benchmark by Lech Mazur (github.com/lechmazur/elimination_game)
    terms: allowed

  - id: lechmazur-generalization
    name: Thematic generalization (Lech Mazur)
    homepage: https://github.com/lechmazur/generalization
    fetch: github:lechmazur/generalization/README.md
    table: 0
    model: Model
    scores: [Inverse-Rank Score, Top-1 Accuracy]
    headline: [Inverse-Rank Score]
    units: { Top-1 Accuracy: percent }
    ignore: [Rank]
    every: 7d
    min_rows: 20
    license: none stated
    attribution: Thematic generalization benchmark by Lech Mazur (github.com/lechmazur/generalization)
    terms: allowed

  - id: lechmazur-sycophancy
    name: Sycophancy (Lech Mazur)
    homepage: https://github.com/lechmazur/sycophancy
    fetch: github:lechmazur/sycophancy/README.md
    table: 0
    model: Model
    scores: [Sycophancy, Conditional]
    headline: [Sycophancy]
    labels: { Conditional: Conditional sycophancy }
    lower_is_better: [Sycophancy, Conditional]
    unit: percent
    ignore: [Rank]
    every: 7d
    min_rows: 15
    license: none stated
    attribution: Sycophancy benchmark by Lech Mazur (github.com/lechmazur/sycophancy)
    terms: allowed

  - id: step-game
    name: Step Game (Lech Mazur)
    homepage: https://github.com/lechmazur/step_game
    fetch: github:lechmazur/step_game/README.md
    table: 0
    model: Model
    scores: [mu]
    labels: { mu: TrueSkill μ }
    ignore: [Rank]
    every: 7d
    min_rows: 50
    license: none stated
    attribution: Step Game benchmark by Lech Mazur (github.com/lechmazur/step_game)
    terms: allowed

  - id: confabulations
    name: Confabulations (Lech Mazur)
    homepage: https://github.com/lechmazur/confabulations
    fetch: github:lechmazur/confabulations/README.md
    table: 0
    model: Model
    scores: [Weighted, Confab %, Non-Resp %]
    headline: [Weighted]
    labels: { Weighted: Weighted confabulation and non-response, Confab %: Confabulation rate, Non-Resp %: Non-response rate }
    units: { Confab %: percent, Non-Resp %: percent }
    lower_is_better: [Weighted, Confab %, Non-Resp %]
    ignore: [Rank]
    every: 7d
    min_rows: 50
    license: none stated
    attribution: Confabulations benchmark by Lech Mazur (github.com/lechmazur/confabulations)
    terms: allowed

  # Kagi's own LLM benchmark, a Markdown table in its documentation repository.
  - id: kagi
    name: Kagi LLM Benchmark
    homepage: https://help.kagi.com/kagi/ai/llm-benchmark.html
    fetch: github:kagisearch/kagi-docs/docs/kagi/ai/llm-benchmark.md
    table: 0
    model: model
    key: [model, provider]
    context: [provider]
    duplicates: drop            # two different minimax-01 rows from the same provider
    scores: ["%accuracy", Cost($), time/task, TPS]
    headline: ["%accuracy"]
    labels: { "%accuracy": Kagi benchmark accuracy, Cost($): Cost ($), time/task: Seconds per task, TPS: Tokens per second }
    units: { "%accuracy": percent, Cost($): USD, time/task: s }
    lower_is_better: [Cost($), time/task]
    every: 1d
    min_rows: 100
    license: none stated
    attribution: Kagi LLM Benchmarking Project (help.kagi.com/kagi/ai/llm-benchmark.html)
    terms: allowed

  # LLM Chess: models play chess against a random player and each other; Elo with a 95% margin.
  - id: llm-chess
    name: LLM Chess
    homepage: https://maxim-saplin.github.io/llm_chess/
    fetch: github:maxim-saplin/llm_chess/data/elo_refined.csv
    model: Player
    scores: [elo, win_loss, mistakes_per_1000moves, price_per_1000_moves]
    headline: [elo]
    labels: { elo: Chess Elo, win_loss: Win/loss score, mistakes_per_1000moves: Mistakes per 1000 moves, price_per_1000_moves: Cost per 1000 moves ($) }
    units: { elo: elo, price_per_1000_moves: USD }
    lower_is_better: [mistakes_per_1000moves, price_per_1000_moves]
    date: min_game_date
    every: 1d
    min_rows: 150
    license: Apache-2.0
    attribution: LLM Chess by Maksim Saplin (github.com/maxim-saplin/llm_chess), Apache-2.0
    terms: allowed

  # MMLU-Pro: TIGER-Lab's leaderboard mixes its own runs with scores model makers reported.
  - id: mmlu-pro
    name: MMLU-Pro
    homepage: https://huggingface.co/spaces/TIGER-Lab/MMLU-Pro
    fetch: https://huggingface.co/datasets/TIGER-Lab/mmlu_pro_leaderboard_submission/resolve/main/results.csv
    model: Models
    key: [Models, Data Source]  # a model can have both a TIGER-Lab run and a self-reported score
    context: [Data Source]
    run_by_from: { column: Data Source, values: { TIGER-Lab: independent, TIGER-LAb: independent, Self-Reported: lab, Sefl-Reported: lab } }
    duplicates: drop            # the file lists LLaDA twice
    headline: [Overall]
    ignore: [Model Size(B)]
    unit: fraction
    tags: [knowledge]
    every: 7d
    min_rows: 200
    license: Apache-2.0
    attribution: MMLU-Pro leaderboard by TIGER-Lab (huggingface.co/datasets/TIGER-Lab/mmlu_pro_leaderboard_submission), Apache-2.0
    terms: allowed
